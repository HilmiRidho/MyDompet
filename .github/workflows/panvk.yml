name: Build PanVK ARM64 Native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup QEMU untuk Emulasi ARM64
        uses: docker/setup-qemu-action@v3

      - name: Jalankan Kompilasi di Ubuntu ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace ubuntu:24.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo '=== 1. Aktifkan deb-src & Install Semua Dependensi Otomatis ==='
            # Mengaktifkan repositori deb-src di Ubuntu 24.04
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
            apt update
            
            # Pasang SEMUA dependensi Mesa bawaan Ubuntu sekaligus!
            apt build-dep -y mesa
            
            # Pasang tools tambahan & update meson ke versi paling baru
            apt install -y git python3-pip
            pip3 install --upgrade meson mako --break-system-packages

            echo '=== 2. Clone Mesa Git Terbaru (Wajib untuk /dev/mali0) ==='
            git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git /mesa
            cd /mesa

            echo '=== 3. Setup Meson Build ==='
            meson setup build/ \
              --prefix=/usr \
              -Dbuildtype=release \
              -Dplatforms=x11,wayland \
              -Dgallium-drivers=panfrost \
              -Dvulkan-drivers=panfrost \
              -Dglx=dri \
              -Dgbm=enabled \
              -Degl=enabled \
              -Dgles1=disabled \
              -Dgles2=enabled

            echo '=== 4. Kompilasi Driver PanVK ==='
            ninja -C build/

            echo '=== 5. Bungkus File Jadi (Packaging) ==='
            mkdir -p /workspace/out
            DESTDIR=/workspace/out ninja -C build/ install
            cd /workspace/out/usr
            tar -czvf /workspace/panvk-arm64-glibc.tar.gz .
          "

      - name: Upload File Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: panvk-arm64-glibc
          path: panvk-arm64-glibc.tar.gz
