name: Build PanVK ARM64 Native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup QEMU untuk Emulasi ARM64
        uses: docker/setup-qemu-action@v3

      - name: Jalankan Kompilasi di Ubuntu ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace ubuntu:24.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo '=== 1. Install Dependencies ==='
            apt update && apt install -y \
              git build-essential ninja-build python3-pip python3-yaml \
              bison flex pkg-config cmake \
              libudev-dev libdrm-dev libvulkan-dev \
              libx11-dev libxext-dev libxfixes-dev libxcb-glx0-dev libxcb-shm0-dev \
              libx11-xcb-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
              libxcb-randr0-dev libxrandr-dev libxxf86vm-dev libwayland-dev \
              wayland-protocols libglvnd-dev zlib1g-dev libzstd-dev

            echo '=== 2. Update Meson ke Versi Terbaru ==='
            pip3 install --upgrade meson mako --break-system-packages

            echo '=== 3. Clone Mesa Git ==='
            git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git /mesa
            cd /mesa

            echo '=== 4. Setup Meson Build ==='
            meson setup build/ \
              --prefix=/usr \
              -Dbuildtype=release \
              -Dplatforms=x11,wayland \
              -Dgallium-drivers=panfrost \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled \
              -Dglx=dri \
              -Dgbm=enabled \
              -Degl=enabled \
              -Dgles1=disabled \
              -Dgles2=enabled

            echo '=== 5. Compile PanVK ==='
            ninja -C build/

            echo '=== 6. Packaging Artifact ==='
            mkdir -p /workspace/out
            DESTDIR=/workspace/out ninja -C build/ install
            cd /workspace/out/usr
            tar -czvf /workspace/panvk-arm64-glibc.tar.gz .
          "

      - name: Upload File Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: panvk-arm64-glibc
          path: panvk-arm64-glibc.tar.gz
